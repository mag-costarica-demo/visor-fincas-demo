<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor SIG - Introducción a GitHub</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100%; }
    .titulo {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 50px;
      background: white;
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      max-width: 360px;
    }
    .titulo h3 { margin: 0 0 4px; }
    .titulo p { margin: 0; font-size: 13px; }
  </style>
</head>

<body>
  <div class="titulo">
    <h3>Visor SIG de demostración</h3>
    <p>Límites administrativos y parcelas de café y musáceas.</p>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
